mutation updateReservations(
  $ids: [UUID!]
  $modelId: UUID!
  $endDate: Date!
  $startDate: Date!
  $quantity: Int!
  $userId: UUID
  $poolIds: [UUID!]
  $startTime: Time
  $endTime: Time
) {
  deleteReservationLines(ids: $ids)
  createReservation(
    modelId: $modelId
    endDate: $endDate
    startDate: $startDate
    quantity: $quantity
    userId: $userId
    inventoryPoolIds: $poolIds
    excludeReservationIds: $ids
    startTime: $startTime
    endTime: $endTime
  ) {
    id
    inventoryPool {
      id
      name
    }
    model {
      id
      name
      images {
        id
        imageUrl
      }
      totalReservableQuantities {
        inventoryPool {
          id
          name
        }
        quantity
      }
    }
    startDate
    endDate
    startTime
    endTime
    status
    user {
      id
    }
  }
}
