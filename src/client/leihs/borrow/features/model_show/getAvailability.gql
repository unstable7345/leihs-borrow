query getAvailability(
  $modelId: UUID!
  $startDate: Date
  $endDate: Date
  $userId: UUID
  $poolIds: [UUID!]
  $excludeReservationIds: [UUID!]
  $startTime: Time
  $endTime: Time
) {
  model(userId: $userId, id: $modelId) {
    availability(
      startDate: $startDate
      endDate: $endDate
      inventoryPoolIds: $poolIds
      excludeReservationIds: $excludeReservationIds
      startTime: $startTime
      endTime: $endTime
    ) {
      inventoryPool {
        id
        name
        maximumReservationDuration
        reservationAdvanceDays
        holidays {
          startDate
          endDate
          name
        }
        hourlyReservations
        hourlyReservationsStartTime
        hourlyReservationsEndTime
        maxReservationHours
        isMemberOfAGroup
      }
      dates {
        date
        quantity
        startDateRestrictions
        endDateRestrictions
      }
    }
  }
}
