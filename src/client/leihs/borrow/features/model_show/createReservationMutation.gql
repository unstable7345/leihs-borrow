mutation createReservationForModel(
  $modelId: UUID!
  $endDate: Date!
  $startDate: Date!
  $quantity: Int!
  $userId: UUID
  $poolIds: [UUID!]
  $startTime: Time
  $endTime: Time
) {
  createReservation(
    modelId: $modelId
    endDate: $endDate
    startDate: $startDate
    quantity: $quantity
    userId: $userId
    inventoryPoolIds: $poolIds
    startTime: $startTime
    endTime: $endTime
  ) {
    id
  }
}
